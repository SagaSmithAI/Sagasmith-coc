[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagasmith-coc-mcp"
version = "0.1.0"
description = "Local MCP server for the SagaSmith Call of Cthulhu 7e runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SagaSmithAI" }]
dependencies = [
    "mcp>=2.1.1,<3.0.0",
    "sagasmith-core>=0.2.0,<0.3.0",
    "sagasmith-coc>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
documents = ["sagasmith-core[documents]>=0.2.0,<0.3.0"]
images = ["sagasmith-core[documents]>=0.2.0,<0.3.0"]
embedding = ["sagasmith-core[embedding]>=0.2.0,<0.3.0"]
vector = ["sagasmith-core[vector]>=0.2.0,<0.3.0"]
dense = ["sagasmith-core[embedding,vector]>=0.2.0,<0.3.0"]
all = ["sagasmith-core[documents,embedding,vector]>=0.2.0,<0.3.0"]
gateway = ["aiohttp>=3.11.0,<4.0.0"]
dev = [
    "aiohttp>=3.11.0,<4.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
sagasmith-coc-mcp = "sagasmith_coc_mcp.server:main"
sagasmith-coc-gateway = "sagasmith_coc_mcp.gateway:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sagasmith_coc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.uv.sources]
sagasmith-core = { path = "../../../sagasmith-core", editable = true }
sagasmith-coc = { workspace = true }
