[project]
name = "sagasmith-coc-workspace"
version = "0.2.0"
description = "Development workspace for the SagaSmith CoC domain, MCP, Skills, and UI"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/domain", "packages/mcp"]

[tool.pytest.ini_options]
testpaths = ["packages/domain/tests", "packages/mcp/tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
