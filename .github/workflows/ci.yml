name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: locked-py311
            python_version: "3.11"
            core_ref: 302ce2b9cda575f927a3e4d7f13a310cd798a3d3
          - lane: compatibility-py312
            python_version: "3.12"
            core_ref: main
    name: python (${{ matrix.lane }})
    defaults:
      run:
        working-directory: sagasmith-coc
    steps:
      - uses: actions/checkout@v7
        with:
          path: sagasmith-coc
      - uses: actions/checkout@v7
        with:
          repository: SagaSmithAI/sagasmith-core
          ref: ${{ matrix.core_ref }}
          path: sagasmith-core
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python_version }}
          enable-cache: true
          prune-cache: true
      - run: uv sync --frozen --all-packages --all-extras
      - run: uv run --no-sync ruff check packages/domain packages/mcp
      - run: uv run --no-sync pytest packages/domain/tests
      - run: uv run --no-sync pytest packages/mcp/tests

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate CoC Skill documents
        shell: python
        run: |
          import py_compile
          from pathlib import Path

          skills = list(Path("skills").rglob("SKILL.md"))
          if not skills:
              raise SystemExit("no SKILL.md files found")
          for path in skills:
              text = path.read_text(encoding="utf-8-sig")
              if text.startswith("---\n"):
                  frontmatter = text.split("---", 2)[1]
                  for key in ("name:", "description:"):
                      if key not in frontmatter:
                          raise SystemExit(f"{path}: missing {key[:-1]}")
              elif not text.lstrip().startswith("#"):
                  raise SystemExit(f"{path}: expected frontmatter or heading")
          for path in Path("skills").rglob("*.py"):
              py_compile.compile(str(path), doraise=True)
      - name: Validate CoC Pack authoring Skill
        run: >-
          python skills/coc-module-generator/scripts/validate_skill.py
          skills/coc-module-generator

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:ui
      - run: npm run test:ui
      - run: npm run build:ui
